<!-- Vela — icône boussole, variante sombre (mode nuit).
     Tuile bleu nuit, cadran clair, aiguille corail lavée.
     Rendu : build/make-icons.cjs. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3C4459"/>
      <stop offset="1" stop-color="#171A24"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <circle cx="90" cy="90" r="60" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
  <g stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
    <line x1="90" y1="38" x2="90" y2="46"/>
    <line x1="90" y1="134" x2="90" y2="142"/>
    <line x1="38" y1="90" x2="46" y2="90"/>
    <line x1="134" y1="90" x2="142" y2="90"/>
  </g>
  <g transform="rotate(35 90 90)">
    <polygon points="90,48 103,90 77,90" fill="#FF8A6B"/>
    <polygon points="90,132 103,90 77,90" fill="#E8ECF5" fill-opacity="0.85"/>
  </g>
  <circle cx="90" cy="90" r="6" fill="#171A24" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.5"/>
  <rect x="4" y="4" width="172" height="92" rx="36" fill="url(#gloss)"/>
  <rect x="1" y="1" width="178" height="178" rx="39" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
