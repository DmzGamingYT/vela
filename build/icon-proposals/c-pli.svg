  <g clip-path="url(#c-tile)">
    <rect x="96" y="96" width="832" height="832" fill="url(#c-base)"/>

    <!-- Deux facettes, une seule arête : rien d'autre à comprendre. -->
    <path d="M452 190C452 380 452 580 452 792H716C664 604 566 372 452 190Z" fill="url(#c-lit)" filter="url(#c-shadow)"/>
    <path d="M452 190C410 380 386 604 372 792H452Z" fill="url(#c-shade)"/>
    <path d="M452 196V790" stroke="url(#c-fold)" stroke-width="6" stroke-linecap="round"/>

    <!-- La base : une eau presque noire, trois pixels de lumière. -->
    <rect x="96" y="792" width="832" height="136" fill="#0A0428" fill-opacity="0.72"/>
    <path d="M300 792H724" stroke="#FFD9AE" stroke-opacity="0.28" stroke-width="3" stroke-linecap="round"/>

    <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z" fill="none" stroke="url(#c-rim)" stroke-width="3"/>
  </g>
