<!doctype html><meta charset="utf-8"><style>html,body{margin:0;width:1024px;height:1024px;background:transparent;overflow:hidden}svg{display:block;width:1024px;height:1024px}</style><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Vela — Horizon</title>
  <defs>
    <linearGradient id="b-sky" x1="512" y1="96" x2="512" y2="702" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6C58F2"/>
      <stop offset="0.42" stop-color="#4029AE"/>
      <stop offset="1" stop-color="#241466"/>
    </linearGradient>
    <linearGradient id="b-sea" x1="512" y1="702" x2="512" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#150B44"/>
      <stop offset="1" stop-color="#0A0426"/>
    </linearGradient>
    <linearGradient id="b-line" x1="176" y1="702" x2="848" y2="702" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD9AE" stop-opacity="0.12"/>
      <stop offset="0.42" stop-color="#FFF0DA" stop-opacity="0.85"/>
      <stop offset="0.72" stop-color="#FFB877" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFB877" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="b-halo" cx="748" cy="702" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB877" stop-opacity="0.5"/>
      <stop offset="0.42" stop-color="#FF9C60" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FF8F55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b-sail" x1="470" y1="212" x2="676" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F7F4FF"/>
      <stop offset="1" stop-color="#E2DCFC"/>
    </linearGradient>
    <linearGradient id="b-rim" x1="250" y1="104" x2="800" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.46"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFD6AA" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="b-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="b-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0D0630" flood-opacity="0.34"/>
    </filter>
    <clipPath id="b-tile">
      <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#b-tile)">
    <rect x="96" y="96" width="832" height="832" fill="url(#b-sky)"/>

    <!-- Le soleil affleure l'horizon : sa moitié basse est mangée par la mer. -->
    <circle cx="748" cy="702" r="260" fill="url(#b-halo)" style="mix-blend-mode:screen"/>
    <circle cx="748" cy="702" r="86" fill="#FFC58C"/>

    <rect x="96" y="702" width="832" height="226" fill="url(#b-sea)"/>
    <path d="M176 702H848" stroke="url(#b-line)" stroke-width="6" stroke-linecap="round"/>

    <!-- Trois reflets, pas plus : à 16 px ils se lisent comme une lumière. -->
    <g fill="#FFC98C" style="mix-blend-mode:screen">
      <rect x="688" y="724" width="120" height="8" rx="4" fill-opacity="0.4"/>
      <rect x="706" y="752" width="84" height="6" rx="3" fill-opacity="0.22"/>
      <rect x="722" y="778" width="50" height="5" rx="2.5" fill-opacity="0.12"/>
    </g>

    <ellipse cx="536" cy="704" rx="150" ry="16" fill="#07031F" opacity="0.44" filter="url(#b-soft)" style="mix-blend-mode:multiply"/>

    <!-- La voile franchit la ligne : c'est elle qui porte la composition. -->
    <path d="M470 300C432 464 410 600 404 702H470Z" fill="#FFFFFF" fill-opacity="0.3"/>
    <path d="M470 212C470 392 470 560 470 702H682C638 560 560 356 470 212Z" fill="url(#b-sail)" filter="url(#b-shadow)"/>
    <path d="M470 216V700" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.95"/>
    <path d="M477 224V696" stroke="#2B1B7C" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round"/>

    <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z" fill="none" stroke="url(#b-rim)" stroke-width="3.5"/>
  </g>
</svg>
