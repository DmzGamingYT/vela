<!-- Vela — boussole pour les petites tailles (16 à 48 px).
     En dessous de 64 px, les graduations de 2 px du maître se délitent : ici
     les traits passent à 4 px, l'aiguille s'élargit et le moyeu grossit, pour
     que le dessin tienne encore à 16 px. Rendu : build/make-icons.cjs. -->
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D3E8"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <circle cx="90" cy="90" r="60" fill="#FFFFFF" fill-opacity="0.55" stroke="#8A97B5" stroke-opacity="0.6" stroke-width="3.5"/>
  <g stroke="#8A97B5" stroke-width="4" stroke-linecap="round">
    <line x1="90" y1="30" x2="90" y2="44"/>
    <line x1="90" y1="136" x2="90" y2="150"/>
    <line x1="30" y1="90" x2="44" y2="90"/>
    <line x1="136" y1="90" x2="150" y2="90"/>
  </g>
  <g transform="rotate(35 90 90)">
    <polygon points="90,42 106,90 74,90" fill="#F0765A"/>
    <polygon points="90,138 106,90 74,90" fill="#2C3140" fill-opacity="0.88"/>
  </g>
  <circle cx="90" cy="90" r="8" fill="#FFFFFF" stroke="#8A97B5" stroke-width="2.5"/>
</svg>
