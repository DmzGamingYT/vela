  <rect x="96" y="96" width="832" height="832" rx="186" fill="#F5E9D6"/>
  <circle cx="512" cy="512" r="344" fill="none" stroke="#3B31A8" stroke-width="92"/>
  <circle cx="512" cy="512" r="296" fill="#FFFBF1"/>
  <path d="M512 176c-40 130-64 232-110 336h110Z" fill="#1E1760"/>
  <path d="M512 176c40 130 64 232 110 336H512Z" fill="#3B2FA8"/>
  <path d="M512 848c-40-130-64-232-110-336h110Z" fill="#8B7CF3"/>
  <path d="M512 848c40-130 64-232 110-336H512Z" fill="#5B4BD2"/>
