<!-- Vela — maître pour les petites tailles (16, 24, 32, 48 px).
     Même dessin, mais réglé pour le pixel : anneau épaissi, aiguille élargie,
     aucune graduation et aucun pivot, couleurs plates et pas d'ombre. À 16 px
     un trait de 24 px de large ne fait plus qu'un quart de pixel — c'est ce
     qui faisait disparaître le cadran, pas la forme elle-même.
     Rendu : build/make-icons.cjs. -->
