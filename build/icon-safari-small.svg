<!-- Vela — maître pour les petites tailles (16, 24, 32, 48 px).
     Le verre est réduit à ce qui survit à la grille du pixel : un dégradé
     papier, un reflet plat sur la moitié haute, un liseré. L'ombre floue et la
     réflexion de la voile disparaissent — à 16 px, elles ne font que salir.
     Rendu : build/make-icons.cjs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="tile-s">
      <rect x="96" y="96" width="832" height="832" rx="186"/>
    </clipPath>
    <linearGradient id="verre-s" x1="512" y1="96" x2="512" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDFA"/>
      <stop offset="0.55" stop-color="#F6F3EC"/>
      <stop offset="1" stop-color="#E7E0D3"/>
    </linearGradient>
    <linearGradient id="voile-s" x1="400" y1="168" x2="610" y2="612" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4A283"/>
      <stop offset="1" stop-color="#D96A45"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile-s)">
    <rect x="96" y="96" width="832" height="832" fill="url(#verre-s)"/>
    <rect x="96" y="96" width="832" height="300" fill="#FFFFFF" opacity="0.3"/>
    <path d="M358 168 C 484 300 580 462 630 612 H358 Z" fill="url(#voile-s)"/>
    <path d="M290 632 H734 L672 726 C 616 744 408 744 352 726 Z" fill="#131512"/>
    <rect x="330" y="782" width="364" height="34" rx="17" fill="#E8805A" opacity="0.8"/>
  </g>
  <rect x="103" y="103" width="818" height="818" rx="179" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="10"/>
</svg>
