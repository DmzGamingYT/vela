<!-- Vela — icône de l'app : « Le monogramme » (0.3.24).
     Un V d'encre sur papier crème, ponctué d'un point d'argile : la signature
     « Vela. ». Une calotte de verre liquide, un reflet et un liseré prismatique
     donnent l'épaisseur d'une lentille sans toucher à la lisibilité.
     Maître 1024, fond transparent. Rendu par scripts/shot.cjs,
     puis build/make-icons.py produit icon.icns, icon.ico et icon-512.png. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Vela — monogramme en verre liquide</title>
  <defs>
    <linearGradient id="paper" x1="190" y1="96" x2="850" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCF7EE"/>
      <stop offset="0.52" stop-color="#F1E5D4"/>
      <stop offset="1" stop-color="#E3D1B8"/>
    </linearGradient>
    <radialGradient id="light" cx="300" cy="180" r="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="512" y1="600" x2="512" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A3B2B" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A3B2B" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="inkLeft" x1="300" y1="292" x2="512" y2="752" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A342C"/>
      <stop offset="1" stop-color="#211D18"/>
    </linearGradient>
    <linearGradient id="inkRight" x1="512" y1="524" x2="744" y2="292" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#211D18"/>
      <stop offset="1" stop-color="#15120F"/>
    </linearGradient>
    <linearGradient id="glassTop" x1="512" y1="96" x2="512" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="180" y1="110" x2="860" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.82"/>
      <stop offset="0.28" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.62" stop-color="#2A2520" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#2A2520" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="prism" x1="180" y1="120" x2="850" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A9DCEB" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.68" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#E7A07B" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="sheen" x1="120" y1="220" x2="760" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain" filterUnits="userSpaceOnUse" x="96" y="96" width="832" height="832">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
    <filter id="liquid" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.018" numOctaves="2" seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="22" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="blur12" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blur2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="blur6" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="tile">
      <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="96" y="96" width="832" height="832" fill="url(#paper)"/>
    <rect x="96" y="96" width="832" height="832" fill="url(#light)"/>
    <rect x="96" y="96" width="832" height="832" fill="url(#shade)"/>
    <rect x="96" y="96" width="832" height="832" filter="url(#grain)" opacity="0.55" style="mix-blend-mode:multiply"/>

    <!-- La calotte de verre : un bord ondulé, comme une surface liquide vue
         de trois quarts. Elle reste au-dessus du V pour ne pas l'effacer. -->
    <path d="M96 208C220 136 350 236 500 186C650 138 770 162 928 244V96H96Z" fill="url(#glassTop)" filter="url(#liquid)" opacity="0.9"/>
    <path d="M96 216C220 144 350 244 500 194C650 146 770 170 928 252" fill="none" stroke="#5F4734" stroke-opacity="0.12" stroke-width="10" filter="url(#blur6)"/>
    <path d="M96 208C220 136 350 236 500 186C650 138 770 162 928 244" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" filter="url(#blur2)"/>
    <ellipse cx="258" cy="160" rx="150" ry="72" transform="rotate(-20 258 160)" fill="#FFFFFF" opacity="0.32" filter="url(#blur12)"/>
    <rect x="120" y="260" width="760" height="150" rx="75" transform="rotate(-32 512 512)" fill="url(#sheen)" opacity="0.5" filter="url(#blur12)"/>
    <path d="M590 902C670 862 760 862 848 898" fill="none" stroke="#E8F7F8" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round" filter="url(#blur12)"/>

    <!-- Le V est en deux faces : la lumière vient de la gauche, le pli reste
         lisible à grande taille sans devenir une ombre à 16 px. -->
    <path d="M280 292H430L512 524V752Z" fill="url(#inkLeft)"/>
    <path d="M512 752V524L594 292H744Z" fill="url(#inkRight)"/>

    <!-- Le point d'argile ferme le mot, comme le point de « Vela. ». -->
    <circle cx="744" cy="702" r="50" fill="#C46F4C"/>
    <circle cx="730" cy="687" r="14" fill="#E8A181" opacity="0.32"/>

    <!-- Un second reflet, très faible, passe au-dessus du V : la lumière
         traverse la dalle au lieu de s'arrêter devant le monogramme. -->
    <rect x="140" y="380" width="740" height="250" rx="125" transform="rotate(-32 512 512)" fill="url(#sheen)" opacity="0.12" filter="url(#blur12)"/>

    <!-- Épaisseur de la lentille : arête claire en haut à gauche, ombre en bas
         à droite, et une frange prismatique à peine perceptible. -->
    <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z" fill="none" stroke="url(#glassEdge)" stroke-width="6"/>
    <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z" fill="none" stroke="url(#prism)" stroke-width="2.5" opacity="0.65"/>
  </g>
</svg>
