<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="base" x1="190" y1="120" x2="880" y2="950" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7364EF" />
      <stop offset="0.42" stop-color="#5F4EE1" />
      <stop offset="0.78" stop-color="#4F3CCA" />
      <stop offset="1" stop-color="#422FB6" />
    </linearGradient>

    <radialGradient id="glowTop" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(470 210) scale(520 420)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="sheen" x1="512" y1="96" x2="512" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="rim" x1="256" y1="100" x2="790" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="1" stop-color="#2A1D86" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="sail" x1="470" y1="250" x2="600" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.62" stop-color="#F7F7FF" />
      <stop offset="1" stop-color="#E2E2FA" />
    </linearGradient>

    <linearGradient id="sun" x1="620" y1="270" x2="710" y2="365" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8D6A8" />
      <stop offset="1" stop-color="#F1BE86" />
    </linearGradient>

    <filter id="tileShadow" x="-22%" y="-16%" width="148%" height="148%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#2A1F8C" flood-opacity="0.34" />
    </filter>

    <filter id="sailShadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#31219B" flood-opacity="0.28" />
    </filter>

    <clipPath id="tile">
      <rect x="96" y="96" width="832" height="832" rx="196" />
    </clipPath>
  </defs>

  <g filter="url(#tileShadow)">
    <rect x="96" y="96" width="832" height="832" rx="196" fill="url(#base)" />
  </g>

  <g clip-path="url(#tile)">
    <rect x="96" y="96" width="832" height="832" fill="url(#glowTop)" />
    <rect x="96" y="96" width="832" height="504" fill="url(#sheen)" />
    <rect x="100" y="100" width="824" height="824" rx="192" fill="none" stroke="url(#rim)" stroke-width="2.5" />

    <!-- Soleil bas, à droite de la voile -->
    <circle cx="664" cy="316" r="50" fill="url(#sun)" />

    <!-- Voile : apex haut, bord gauche concave, bord droit convexe -->
    <g filter="url(#sailShadow)">
      <path d="M494 242C462 388 408 574 352 692c112 20 192 16 264-4-28-152-64-326-122-446Z" fill="url(#sail)" />
    </g>

    <!-- Vague : la mer, sous la coque -->
    <path d="M258 758c58-20 98 6 154 1 58-5 90-24 158-6" fill="none" stroke="#FFFFFF"
      stroke-opacity="0.96" stroke-width="21" stroke-linecap="round" />
  </g>
</svg>
