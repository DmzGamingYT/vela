<!-- Vela — icône de l'app : « le sillage » (0.3.45).

     Tuile papier, voile corail, coque d'encre, deux rides corail : le bateau
     porte la couleur, la tuile reste neutre. Aucun dégradé, aucune ombre, un
     aplat par forme — et trois formes seulement, pour que le dessin tienne à
     16 px.

     Repère : tuile macOS de 832 px (marge de 96), motif à l'intérieur.
     Petites tailles : `icon-safari-small.svg` (voile plus large, coque plus
     épaisse, rides plus courtes). Barre de menus : `icon-template-safari.svg`.

     Rendu et export :
       env -u ELECTRON_RUN_AS_NODE node_modules/electron/dist/Electron.app/Contents/MacOS/Electron build/make-icons.cjs -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"
     role="img" aria-labelledby="vela-title vela-desc">
  <title id="vela-title">Vela</title>
  <desc id="vela-desc">Une barque corail et encre sur une tuile papier, suivie de deux rides : le sillage.</desc>

  <rect x="96" y="96" width="832" height="832" rx="186" fill="#F7F6F2"/>

  <!-- La voile. -->
  <path d="M372 176 C 484 296 570 460 618 606 H372 Z" fill="#E8805A"/>

  <!-- La coque. -->
  <path d="M318 626 H706 L652 712 C 602 728 422 728 372 712 Z" fill="#131512"/>

  <!-- Les deux rides : le sillage, en corail plus clair vers l'arrière. -->
  <rect x="312" y="764" width="400" height="24" rx="12" fill="#E8805A" opacity="0.8"/>
  <rect x="360" y="820" width="304" height="20" rx="10" fill="#E8805A" opacity="0.45"/>
</svg>
