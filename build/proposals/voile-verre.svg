<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Vela — proposition A : « Voile de verre » -->
  <defs>
    <linearGradient id="a-base" x1="210" y1="110" x2="870" y2="965" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8070FF" />
      <stop offset="0.3" stop-color="#6552EA" />
      <stop offset="0.66" stop-color="#4B35C8" />
      <stop offset="0.88" stop-color="#372592" />
      <stop offset="1" stop-color="#2A1A75" />
    </linearGradient>

    <radialGradient id="a-warm" cx="690" cy="286" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD3A2" stop-opacity="0.42" />
      <stop offset="0.45" stop-color="#F9AE79" stop-opacity="0.14" />
      <stop offset="1" stop-color="#F9AE79" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="a-spec" cx="366" cy="196" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.09" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="a-veil" x1="512" y1="96" x2="512" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="a-floor" x1="512" y1="600" x2="512" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1C1258" stop-opacity="0" />
      <stop offset="0.55" stop-color="#1B1054" stop-opacity="0.16" />
      <stop offset="1" stop-color="#160C46" stop-opacity="0.42" />
    </linearGradient>

    <linearGradient id="a-rim" x1="250" y1="110" x2="800" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72" />
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="1" stop-color="#150B3E" stop-opacity="0.34" />
    </linearGradient>

    <linearGradient id="a-sail" x1="396" y1="268" x2="614" y2="688" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.34" stop-color="#FCFCFF" />
      <stop offset="0.72" stop-color="#EFEEFF" />
      <stop offset="1" stop-color="#DCD9FA" />
    </linearGradient>

    <linearGradient id="a-sail-shade" x1="352" y1="480" x2="470" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E63C8" stop-opacity="0.24" />
      <stop offset="0.55" stop-color="#8B82DA" stop-opacity="0.07" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="a-sun" x1="648" y1="252" x2="700" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFEBC8" />
      <stop offset="0.5" stop-color="#FBD49B" />
      <stop offset="1" stop-color="#EEB075" />
    </linearGradient>

    <linearGradient id="a-sea" x1="512" y1="726" x2="512" y2="812" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.94" />
      <stop offset="1" stop-color="#E9E6FF" stop-opacity="0.62" />
    </linearGradient>

    <radialGradient id="a-vignette" cx="512" cy="470" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0.62" stop-color="#0F0733" stop-opacity="0" />
      <stop offset="1" stop-color="#0F0733" stop-opacity="0.26" />
    </radialGradient>

    <linearGradient id="a-streak" x1="430" y1="300" x2="500" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.34" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter id="a-tile-shadow" x="-20%" y="-18%" width="140%" height="146%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#1B1270" flood-opacity="0.32" />
    </filter>

    <filter id="a-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" />
    </filter>

    <filter id="a-bevel" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="9" />
    </filter>

    <filter id="a-sail-soft" x="-30%" y="-26%" width="160%" height="154%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2A1B92" flood-opacity="0.34" />
    </filter>

    <filter id="a-reflect" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11" />
    </filter>

    <filter id="a-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" seed="7" result="n" />
      <feColorMatrix in="n" type="saturate" values="0" result="g" />
      <feComponentTransfer in="g" result="t">
        <feFuncA type="linear" slope="0.5" intercept="0" />
      </feComponentTransfer>
      <feComposite in="t" in2="SourceGraphic" operator="in" />
    </filter>

    <clipPath id="a-tile">
      <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z" />
    </clipPath>

    <clipPath id="a-sail-clip">
      <path d="M508 248C454 396 402 570 352 692C438 704 524 694 626 664C560 516 526 372 508 248Z" />
    </clipPath>
  </defs>

  <!-- Tuile de verre -->
  <g filter="url(#a-tile-shadow)">
    <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z" fill="url(#a-base)" />
  </g>

  <g clip-path="url(#a-tile)">
    <!-- Lumière chaude du soleil, puis reflet froid en haut à gauche -->
    <rect x="96" y="96" width="832" height="832" fill="url(#a-warm)" />
    <rect x="96" y="96" width="832" height="832" fill="url(#a-spec)" />
    <rect x="96" y="96" width="832" height="832" fill="url(#a-veil)" />
    <rect x="96" y="96" width="832" height="832" fill="url(#a-floor)" />

    <!-- Biseau intérieur : lumière en haut, ombre portée en bas -->
    <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z"
      fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="13" filter="url(#a-bevel)" />

    <!-- Halo du soleil -->
    <circle cx="676" cy="298" r="118" fill="#FFCE9C" fill-opacity="0.28" filter="url(#a-soft)" />
    <circle cx="676" cy="298" r="54" fill="url(#a-sun)" />
    <circle cx="662" cy="282" r="15" fill="#FFF6E4" fill-opacity="0.66" filter="url(#a-bevel)" />

    <!-- Reflet de la voile sous la ligne d’eau -->
    <g transform="translate(0 1482) scale(1 -1)" opacity="0.2" filter="url(#a-reflect)">
      <path d="M508 248C454 396 402 570 352 692C438 704 524 694 626 664C560 516 526 372 508 248Z" fill="#FFFFFF" />
    </g>

    <!-- Voile : verre dépoli, bordé de lumière -->
    <g filter="url(#a-sail-soft)">
      <path d="M508 248C454 396 402 570 352 692C438 704 524 694 626 664C560 516 526 372 508 248Z" fill="url(#a-sail)" />
    </g>
    <g clip-path="url(#a-sail-clip)">
      <rect x="352" y="248" width="274" height="456" fill="url(#a-sail-shade)" />
      <path d="M470 300C486 402 498 520 486 660" stroke="url(#a-streak)" stroke-width="26" fill="none" filter="url(#a-bevel)" opacity="0.8" />
    </g>
    <!-- Arête éclairée côté soleil -->
    <path d="M508 252C526 376 560 518 622 662" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="4.5" stroke-linecap="round" />

    <!-- Mer : deux caustiques, la haute nette, la basse éteinte -->
    <path d="M246 764C330 744 382 774 462 764C544 754 596 730 668 746" fill="none" stroke="url(#a-sea)" stroke-width="21" stroke-linecap="round" />
    <path d="M306 812C376 798 420 818 484 810C552 802 592 786 648 796" fill="none" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="10" stroke-linecap="round" />

    <!-- Bord de la tuile : lumière rasante -->
    <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z"
      fill="none" stroke="url(#a-rim)" stroke-width="3.2" />

    <rect x="96" y="96" width="832" height="832" fill="url(#a-vignette)" />
    <rect x="96" y="96" width="832" height="832" filter="url(#a-grain)" opacity="0.05" />
  </g>
</svg>
