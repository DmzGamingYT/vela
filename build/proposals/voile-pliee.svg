<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Vela — proposition B : « Voile pliée » -->
  <defs>
    <linearGradient id="b-base" x1="230" y1="104" x2="850" y2="968" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6F5DF5" />
      <stop offset="0.34" stop-color="#4F3AD6" />
      <stop offset="0.68" stop-color="#31208F" />
      <stop offset="1" stop-color="#1B1055" />
    </linearGradient>

    <radialGradient id="b-horizon" cx="700" cy="716" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC98F" stop-opacity="0.5" />
      <stop offset="0.4" stop-color="#FF9E6B" stop-opacity="0.16" />
      <stop offset="1" stop-color="#FF9E6B" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="b-spec" x1="250" y1="150" x2="700" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34" />
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="b-sweep" x1="140" y1="900" x2="700" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.13" />
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="b-rim" x1="240" y1="110" x2="800" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.66" />
      <stop offset="0.26" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="0.7" stop-color="#FFD2A6" stop-opacity="0.3" />
      <stop offset="1" stop-color="#FFE0BC" stop-opacity="0.42" />
    </linearGradient>

    <linearGradient id="b-sea" x1="512" y1="700" x2="512" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#120A3A" stop-opacity="0.5" />
      <stop offset="0.32" stop-color="#1A0F49" stop-opacity="0.22" />
      <stop offset="1" stop-color="#0E0730" stop-opacity="0.42" />
    </linearGradient>

    <linearGradient id="b-waterline" x1="230" y1="708" x2="800" y2="708" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE4C6" stop-opacity="0.12" />
      <stop offset="0.46" stop-color="#FFF4E8" stop-opacity="0.72" />
      <stop offset="0.72" stop-color="#FFD29B" stop-opacity="0.92" />
      <stop offset="1" stop-color="#FFC48A" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="b-left" x1="404" y1="300" x2="540" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72" />
      <stop offset="0.55" stop-color="#FFE9D2" stop-opacity="0.46" />
      <stop offset="1" stop-color="#FFCE9E" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="b-right" x1="540" y1="260" x2="664" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.46" stop-color="#FDFBFF" />
      <stop offset="0.8" stop-color="#EDE9FF" />
      <stop offset="1" stop-color="#D9D3F8" />
    </linearGradient>

    <linearGradient id="b-sun" x1="668" y1="606" x2="736" y2="708" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF1D4" />
      <stop offset="0.45" stop-color="#FCD193" />
      <stop offset="1" stop-color="#EFA96B" />
    </linearGradient>

    <radialGradient id="b-vignette" cx="512" cy="480" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0.6" stop-color="#0B0526" stop-opacity="0" />
      <stop offset="1" stop-color="#0B0526" stop-opacity="0.3" />
    </radialGradient>

    <filter id="b-tile-shadow" x="-20%" y="-18%" width="140%" height="146%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#160D5E" flood-opacity="0.34" />
    </filter>

    <filter id="b-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26" />
    </filter>

    <filter id="b-glow-sm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" />
    </filter>

    <filter id="b-bevel" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="10" />
    </filter>

    <filter id="b-sail" x="-30%" y="-26%" width="160%" height="154%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1D1268" flood-opacity="0.3" />
    </filter>

    <filter id="b-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.94" numOctaves="3" seed="13" result="n" />
      <feColorMatrix in="n" type="saturate" values="0" result="g" />
      <feComponentTransfer in="g" result="t">
        <feFuncA type="linear" slope="0.5" intercept="0" />
      </feComponentTransfer>
      <feComposite in="t" in2="SourceGraphic" operator="in" />
    </filter>

    <clipPath id="b-tile">
      <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z" />
    </clipPath>

    <clipPath id="b-left-clip">
      <path d="M540 236C486 372 432 560 404 704H540Z" />
    </clipPath>
  </defs>

  <g filter="url(#b-tile-shadow)">
    <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z" fill="url(#b-base)" />
  </g>

  <g clip-path="url(#b-tile)">
    <!-- Ciel : lumière chaude posée sur l’horizon -->
    <rect x="96" y="96" width="832" height="832" fill="url(#b-spec)" />
    <rect x="96" y="96" width="832" height="832" fill="url(#b-sweep)" />
    <rect x="96" y="96" width="832" height="832" fill="url(#b-horizon)" />

    <!-- Biseau : arête supérieure lumineuse -->
    <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z"
      fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="14" filter="url(#b-bevel)" />

    <!-- Soleil bas sur l’eau -->
    <circle cx="702" cy="664" r="104" fill="#FFB983" fill-opacity="0.32" filter="url(#b-soft)" />
    <circle cx="702" cy="664" r="56" fill="url(#b-sun)" />

    <!-- Voile : deux panneaux, le gauche laisse passer la lumière -->
    <path d="M540 236C486 372 432 560 404 704H540Z" fill="url(#b-left)" />
    <g clip-path="url(#b-left-clip)">
      <path d="M404 704C432 560 486 372 540 236" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="7" filter="url(#b-glow-sm)" />
    </g>
    <path d="M540 236C570 400 606 566 664 676C630 700 586 704 540 704Z" fill="url(#b-right)" filter="url(#b-sail)" />

    <!-- Mât : arête commune aux deux panneaux -->
    <path d="M540 244V700" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round" />
    <path d="M540 244V700" stroke="#FFE7CC" stroke-opacity="0.45" stroke-width="12" stroke-linecap="round" filter="url(#b-glow-sm)" />

    <!-- Mer : bande sombre, ligne d’eau, chatoyance sous le soleil -->
    <rect x="96" y="704" width="832" height="226" fill="url(#b-sea)" />
    <path d="M214 708H806" stroke="url(#b-waterline)" stroke-width="4" stroke-linecap="round" />
    <g fill="#FFDBB2" stroke-linecap="round">
      <rect x="642" y="742" width="126" height="9" rx="4.5" fill-opacity="0.42" />
      <rect x="660" y="782" width="92" height="7" rx="3.5" fill-opacity="0.3" />
      <rect x="678" y="818" width="58" height="6" rx="3" fill-opacity="0.2" />
    </g>

    <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z"
      fill="none" stroke="url(#b-rim)" stroke-width="3.2" />

    <rect x="96" y="96" width="832" height="832" fill="url(#b-vignette)" />
    <rect x="96" y="96" width="832" height="832" filter="url(#b-grain)" opacity="0.045" />
  </g>
</svg>
