<!doctype html><meta charset="utf-8"><style>
  *{box-sizing:border-box}
  html,body{margin:0;width:1000px;height:680px;font:13px/1.4 -apple-system,'SF Pro Text',sans-serif;color:#1b1b22}
  .band{position:relative;height:340px;display:flex;align-items:center;gap:96px;padding:36px 60px 22px}
  .light{background:#ececf1}
  .dark{background:#17171b;color:#f2f2f7}
  .card{display:flex;flex-direction:column;align-items:center;gap:12px}
  .card > img{width:150px;height:150px;display:block;filter:drop-shadow(0 12px 20px rgba(20,12,70,.2))}
  .sizes{display:flex;align-items:flex-end;gap:14px;height:96px}
  .sizes img{display:block;filter:none}
  .label{font-size:12px;opacity:.7}
  .title{position:absolute;top:12px;left:60px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.45}
</style>

    <div class="label">Actuelle — 0.3.13</div></div>
  <div class="card"><img src="voile-couchant.png" width="150" height="150">

    <div class="label">Proposition — voile au couchant</div></div>
</div>
