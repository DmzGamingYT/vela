<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Vela — proposition C : « Voile en ruban » -->
  <defs>
    <linearGradient id="c-base" x1="214" y1="106" x2="866" y2="966" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7B69FF" />
      <stop offset="0.3" stop-color="#5A45E2" />
      <stop offset="0.64" stop-color="#3C29AE" />
      <stop offset="1" stop-color="#1F1366" />
    </linearGradient>

    <radialGradient id="c-spec" cx="330" cy="168" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="0.44" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="c-bloom" cx="614" cy="312" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFCE96" stop-opacity="0.8" />
      <stop offset="0.44" stop-color="#FFAE70" stop-opacity="0.28" />
      <stop offset="1" stop-color="#FF9E63" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="c-rim" x1="240" y1="108" x2="806" y2="934" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72" />
      <stop offset="0.24" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="0.68" stop-color="#FFD2A6" stop-opacity="0.2" />
      <stop offset="1" stop-color="#FFE0BC" stop-opacity="0.48" />
    </linearGradient>

    <linearGradient id="c-ribbon" x1="486" y1="240" x2="640" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.36" stop-color="#FCFBFF" />
      <stop offset="0.72" stop-color="#EEECFF" />
      <stop offset="1" stop-color="#D8D4F8" />
    </linearGradient>

    <linearGradient id="c-fold" x1="600" y1="380" x2="672" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="1" stop-color="#9A92DE" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="c-sun" x1="586" y1="278" x2="632" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF7E9" />
      <stop offset="0.4" stop-color="#FDD69F" />
      <stop offset="1" stop-color="#ECA467" />
    </linearGradient>

    <linearGradient id="c-swell" x1="250" y1="762" x2="560" y2="742" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.3" />
    </linearGradient>

    <radialGradient id="c-vignette" cx="512" cy="456" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0.64" stop-color="#0A0426" stop-opacity="0" />
      <stop offset="1" stop-color="#0A0426" stop-opacity="0.3" />
    </radialGradient>

    <filter id="c-tile-shadow" x="-20%" y="-18%" width="140%" height="146%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#150C5E" flood-opacity="0.34" />
    </filter>

    <filter id="c-bevel" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="9" />
    </filter>

    <filter id="c-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" />
    </filter>

    <filter id="c-cast" x="-40%" y="-32%" width="180%" height="172%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#221593" flood-opacity="0.36" />
    </filter>

    <filter id="c-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.93" numOctaves="3" seed="23" result="n" />
      <feColorMatrix in="n" type="saturate" values="0" result="g" />
      <feComponentTransfer in="g" result="t">
        <feFuncA type="linear" slope="0.42" intercept="0" />
      </feComponentTransfer>
      <feComposite in="t" in2="SourceGraphic" operator="in" />
    </filter>

    <clipPath id="c-tile">
      <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z" />
    </clipPath>

    <clipPath id="c-ribbon-clip">
      <path d="M486 238C512 384 588 552 668 690C596 712 512 714 448 702C470 566 480 400 486 238Z" />
    </clipPath>
  </defs>

  <g filter="url(#c-tile-shadow)">
    <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z" fill="url(#c-base)" />
  </g>

  <g clip-path="url(#c-tile)">
    <rect x="96" y="96" width="832" height="832" fill="url(#c-spec)" style="mix-blend-mode: screen" />
    <rect x="96" y="96" width="832" height="832" fill="url(#c-bloom)" style="mix-blend-mode: screen" />

    <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z"
      fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="15" filter="url(#c-bevel)" style="mix-blend-mode: screen" />

    <circle cx="608" cy="308" r="41" fill="url(#c-sun)" />
    <circle cx="608" cy="308" r="41" fill="url(#c-sun)" opacity="0.4" style="mix-blend-mode: screen" />
    <circle cx="594" cy="292" r="11" fill="#FFFBF0" fill-opacity="0.75" style="mix-blend-mode: screen" />

    <!-- Reflet de la voile sur l’eau -->
    <g transform="translate(0 1428) scale(1 -1)" opacity="0.12" filter="url(#c-soft)">
      <path d="M486 238C512 384 588 552 668 690C596 712 512 714 448 702C470 566 480 400 486 238Z" fill="#FFFFFF" />
    </g>

    <!-- Le ruban : une seule surface pliée -->
    <g filter="url(#c-cast)">
      <path d="M486 238C512 384 588 552 668 690C596 712 512 714 448 702C470 566 480 400 486 238Z" fill="url(#c-ribbon)" />
    </g>
    <g clip-path="url(#c-ribbon-clip)">
      <path d="M486 238C512 384 588 552 668 690C596 712 512 714 448 702C470 566 480 400 486 238Z" fill="url(#c-fold)" opacity="0.5" />
      <path d="M486 246C520 396 570 566 640 682" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="26" filter="url(#c-bevel)" />
    </g>
    <path d="M486 242C512 388 588 556 664 688" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="3.6" stroke-linecap="round" />
    <path d="M452 698C500 706 566 708 660 690" fill="none" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="3" stroke-linecap="round" />

    <!-- Houle : un seul trait, puis son écho -->
    <path d="M258 768C334 742 402 780 494 764C556 754 602 738 646 744" fill="none" stroke="url(#c-swell)" stroke-width="19" stroke-linecap="round" />
    <path d="M322 812C388 798 430 816 494 808C546 802 584 790 620 794" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="8" stroke-linecap="round" />

    <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z"
      fill="none" stroke="url(#c-rim)" stroke-width="3.4" />

    <rect x="96" y="96" width="832" height="832" fill="url(#c-vignette)" />
    <rect x="96" y="96" width="832" height="832" filter="url(#c-grain)" opacity="0.05" style="mix-blend-mode: overlay" />
  </g>
</svg>
