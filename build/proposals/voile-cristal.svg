<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Vela — proposition A, second dessin : « Voile de cristal » -->
  <defs>
    <linearGradient id="a2-base" x1="200" y1="104" x2="872" y2="968" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B7BFF" />
      <stop offset="0.26" stop-color="#6A56F0" />
      <stop offset="0.58" stop-color="#4E38CE" />
      <stop offset="0.84" stop-color="#372396" />
      <stop offset="1" stop-color="#2A1A78" />
    </linearGradient>

    <radialGradient id="a2-bloom" cx="672" cy="292" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC98C" stop-opacity="0.85" />
      <stop offset="0.42" stop-color="#FFAE6E" stop-opacity="0.34" />
      <stop offset="1" stop-color="#FF9E63" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="a2-spec" cx="352" cy="176" r="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34" />
      <stop offset="0.46" stop-color="#FFFFFF" stop-opacity="0.07" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="a2-sweep" x1="170" y1="740" x2="720" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="a2-deep" x1="512" y1="640" x2="512" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#170D4E" stop-opacity="0" />
      <stop offset="0.6" stop-color="#150B49" stop-opacity="0.2" />
      <stop offset="1" stop-color="#100737" stop-opacity="0.46" />
    </linearGradient>

    <linearGradient id="a2-rim" x1="250" y1="108" x2="800" y2="934" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.78" />
      <stop offset="0.24" stop-color="#FFFFFF" stop-opacity="0.24" />
      <stop offset="0.66" stop-color="#FFD3A6" stop-opacity="0.18" />
      <stop offset="1" stop-color="#FFDDB8" stop-opacity="0.46" />
    </linearGradient>

    <linearGradient id="a2-sail" x1="402" y1="250" x2="608" y2="704" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.3" stop-color="#FEFDFF" />
      <stop offset="0.68" stop-color="#F0EFFF" />
      <stop offset="0.9" stop-color="#DFDCF9" />
      <stop offset="1" stop-color="#CFCBF0" />
    </linearGradient>

    <linearGradient id="a2-sail-shade" x1="344" y1="470" x2="470" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E62C6" stop-opacity="0.3" />
      <stop offset="0.5" stop-color="#7B70D0" stop-opacity="0.1" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="a2-caustic" x1="520" y1="380" x2="600" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD9AC" stop-opacity="0" />
      <stop offset="0.45" stop-color="#FFD9AC" stop-opacity="0.4" />
      <stop offset="1" stop-color="#FFE6C6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="a2-sun" x1="648" y1="258" x2="690" y2="338" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6E6" />
      <stop offset="0.42" stop-color="#FCD39C" />
      <stop offset="1" stop-color="#EDA469" />
    </linearGradient>

    <linearGradient id="a2-sea" x1="512" y1="742" x2="512" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.96" />
      <stop offset="1" stop-color="#E7E3FF" stop-opacity="0.5" />
    </linearGradient>

    <radialGradient id="a2-vignette" cx="512" cy="452" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0.66" stop-color="#0C0529" stop-opacity="0" />
      <stop offset="1" stop-color="#0C0529" stop-opacity="0.2" />
    </radialGradient>

    <filter id="a2-tile-shadow" x="-20%" y="-18%" width="140%" height="146%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#1A1170" flood-opacity="0.32" />
    </filter>

    <filter id="a2-bevel" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="9" />
    </filter>

    <filter id="a2-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20" />
    </filter>

    <filter id="a2-sail-cast" x="-40%" y="-30%" width="180%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#241694" flood-opacity="0.36" />
    </filter>

    <filter id="a2-water-cast" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" />
    </filter>

    <filter id="a2-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="3" seed="5" result="n" />
      <feColorMatrix in="n" type="saturate" values="0" result="g" />
      <feComponentTransfer in="g" result="t">
        <feFuncA type="linear" slope="0.42" intercept="0" />
      </feComponentTransfer>
      <feComposite in="t" in2="SourceGraphic" operator="in" />
    </filter>

    <clipPath id="a2-tile">
      <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z" />
    </clipPath>

    <clipPath id="a2-sail-clip">
      <path d="M512 230C470 372 404 566 344 706C424 716 520 712 604 690C566 540 534 372 512 230Z" />
    </clipPath>
  </defs>

  <g filter="url(#a2-tile-shadow)">
    <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z" fill="url(#a2-base)" />
  </g>

  <g clip-path="url(#a2-tile)">
    <rect x="96" y="96" width="832" height="832" fill="url(#a2-spec)" style="mix-blend-mode: screen" />
    <rect x="96" y="96" width="832" height="832" fill="url(#a2-sweep)" />
    <rect x="96" y="96" width="832" height="832" fill="url(#a2-deep)" />

    <!-- Bloom du soleil : lumière ajoutée, pas de gris peint -->
    <rect x="96" y="96" width="832" height="832" fill="url(#a2-bloom)" style="mix-blend-mode: screen" />

    <!-- Arête supérieure : le verre accroche la lumière -->
    <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z"
      fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="15" filter="url(#a2-bevel)" style="mix-blend-mode: screen" />

    <circle cx="670" cy="298" r="47" fill="url(#a2-sun)" />
    <circle cx="670" cy="298" r="47" fill="url(#a2-sun)" style="mix-blend-mode: screen" opacity="0.55" />
    <circle cx="655" cy="282" r="13" fill="#FFFCF2" fill-opacity="0.8" style="mix-blend-mode: screen" />

    <!-- Ombre portée de la voile sur l’eau -->
    <ellipse cx="470" cy="742" rx="168" ry="26" fill="#0E0636" fill-opacity="0.5" filter="url(#a2-water-cast)" style="mix-blend-mode: multiply" />

    <!-- Reflet : voile renversée, très effacée -->
    <g transform="translate(0 1470) scale(1 -1)" opacity="0.13" filter="url(#a2-soft)">
      <path d="M512 230C470 372 404 566 344 706C424 716 520 712 604 690C566 540 534 372 512 230Z" fill="#FFFFFF" />
    </g>

    <!-- Voile : cristal, lumière traversante côté soleil -->
    <g filter="url(#a2-sail-cast)">
      <path d="M512 230C470 372 404 566 344 706C424 716 520 712 604 690C566 540 534 372 512 230Z" fill="url(#a2-sail)" />
    </g>
    <g clip-path="url(#a2-sail-clip)">
      <rect x="344" y="230" width="270" height="490" fill="url(#a2-sail-shade)" />
      <rect x="344" y="230" width="270" height="490" fill="url(#a2-caustic)" style="mix-blend-mode: screen" />
      <path d="M498 268C512 372 520 500 508 676" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="30" fill="none" filter="url(#a2-bevel)" />
    </g>
    <path d="M512 236C534 378 568 540 602 684" fill="none" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="4" stroke-linecap="round" />
    <path d="M512 236C470 378 404 566 348 700" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round" />

    <!-- Mer : une caustique nette, son écho éteint, le reflet du soleil -->
    <path d="M232 766C326 742 382 776 466 764C552 752 604 726 682 744" fill="none" stroke="url(#a2-sea)" stroke-width="22" stroke-linecap="round" />
    <path d="M296 816C372 800 418 822 486 812C556 802 600 784 656 794" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="9" stroke-linecap="round" />
    <g fill="#FFD9AE" style="mix-blend-mode: screen">
      <rect x="646" y="748" width="52" height="8" rx="4" fill-opacity="0.6" />
      <rect x="654" y="774" width="36" height="6" rx="3" fill-opacity="0.34" />
      <rect x="662" y="796" width="22" height="5" rx="2.5" fill-opacity="0.2" />
    </g>

    <path d="M286 96H738C842.5 96 928 181.5 928 286V738C928 842.5 842.5 928 738 928H286C181.5 928 96 842.5 96 738V286C96 181.5 181.5 96 286 96Z"
      fill="none" stroke="url(#a2-rim)" stroke-width="3.4" />

    <rect x="96" y="96" width="832" height="832" fill="url(#a2-vignette)" />
    <rect x="96" y="96" width="832" height="832" filter="url(#a2-grain)" opacity="0.05" style="mix-blend-mode: overlay" />
  </g>
</svg>
