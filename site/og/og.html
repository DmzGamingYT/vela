<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Vela — visuel de partage 1200×630</title>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }

      :root {
        --navy: #131512;
        --night: #0f1311;
        --sea: #1a7a5e;
        --coral: #1a7a5e;
        --cream: #f7f6f2;
        --paper: #f7f6f2;
        --ink: #131512;
        --ink-2: #4d514a;
        --ink-3: #666b62;
        --shell: #b9beb8;
        --line: rgba(19, 21, 18, 0.14);
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Helvetica Neue',
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .frame {
        display: grid;
        grid-template-columns: 660px 1fr;
        width: 100%;
        height: 100%;
        background: var(--paper);
      }

      .panel {
        position: relative;
        overflow: hidden;
        padding: 54px 52px;
        background: var(--night);
        color: var(--cream);
        display: flex;
        flex-direction: column;
      }

      .sun {
        position: absolute;
        top: -190px;
        right: -170px;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        background: var(--coral);
        opacity: 0.16;
      }

      .icon {
        position: relative;
        width: 82px;
        height: 82px;
        border-radius: 19px;
        outline: 2px solid rgba(246, 239, 228, 0.3);
        outline-offset: 5px;
      }

      .kicker {
        position: relative;
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 34px;
        color: #b9beb6;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .kicker i {
        width: 8px;
        height: 8px;
        background: var(--coral);
      }

      h1 {
        position: relative;
        margin-top: 18px;
        font-size: 70px;
        font-weight: 650;
        line-height: 0.94;
        letter-spacing: -0.045em;
      }

      .sub {
        position: relative;
        max-width: 17ch;
        margin-top: 22px;
        color: #b9beb6;
        font-size: 19px;
        line-height: 1.5;
      }

      .foot {
        position: relative;
        margin-top: auto;
        padding-top: 26px;
        border-top: 1px solid rgba(246, 239, 228, 0.22);
        color: #9aa0b8;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12.5px;
        letter-spacing: 0.02em;
      }

      .stage {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 18px;
        padding: 52px 48px;
        min-width: 0;
      }

      .shot {
        border: 2px solid var(--ink);
        border-radius: 4px;
        background: var(--night);
        overflow: hidden;
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 34px;
        padding: 0 12px;
        border-bottom: 2px solid rgba(246, 239, 228, 0.22);
      }

      .dots {
        display: flex;
        gap: 6px;
      }

      .dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--shell);
      }

      .dots span:first-child {
        background: var(--coral);
      }

      .dots span:last-child {
        background: var(--cream);
      }

      .addr {
        flex: 1;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(246, 239, 228, 0.22);
        color: #b9beb6;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 10px;
      }

      .shot img {
        display: block;
        width: 100%;
        height: auto;
      }

      .caption {
        padding-top: 14px;
        border-top: 2px solid var(--ink);
        color: var(--ink-3);
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <section class="panel">
        <span class="sun"></span>
        <img class="icon" src="../public/favicon.svg" alt="" />
        <p class="kicker"><i></i> Navigateur de travail · v{{version}}</p>
        <h1>Le web,<br />votre atelier.</h1>
        <p class="sub">
          Onglets verticaux, espaces isolés, notes locales. L’atelier s’ouvre quand vous en avez
          besoin.
        </p>
        <p class="foot">macOS · Windows · Linux — gratuit, MIT, sans compte</p>
      </section>

      <section class="stage">
        <figure class="shot">
          <div class="bar">
            <span class="dots"><span></span><span></span><span></span></span>
            <span class="addr">vela.local — Accueil</span>
          </div>
          <img src="{{shot}}" alt="" />
        </figure>
        <p class="caption">Vela {{version}} — l’accueil, ses espaces et sa palette</p>
      </section>
    </div>
  </body>
</html>
