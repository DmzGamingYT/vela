<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Azimut — visuel de partage 1200×630</title>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }

      :root {
        --paper: #f2f3fb;
        --surface: #ffffff;
        --ink: #1c2030;
        --ink-2: #4c556b;
        --ink-3: #626c83;
        --line: rgba(28, 32, 48, 0.12);
        --coral: #eb7059;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Helvetica Neue',
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .frame {
        display: grid;
        grid-template-columns: 600px 1fr;
        align-items: center;
        gap: 40px;
        width: 100%;
        height: 100%;
        padding: 0 52px 0 60px;
      }

      .panel {
        position: relative;
        min-width: 0;
      }

      .marks {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .icon {
        width: 74px;
        height: 74px;
        border-radius: 18px;
        box-shadow: 0 2px 6px rgba(28, 34, 60, 0.12);
      }

      .kicker {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--ink-3);
        font-size: 15px;
      }

      .kicker i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--coral);
      }

      h1 {
        margin-top: 30px;
        font-size: 64px;
        font-weight: 400;
        line-height: 1.02;
        letter-spacing: -0.05em;
      }

      h1 b {
        font-weight: 620;
      }

      .sub {
        max-width: 22ch;
        margin-top: 20px;
        color: var(--ink-2);
        font-size: 20px;
        line-height: 1.5;
      }

      .foot {
        display: inline-flex;
        align-items: center;
        margin-top: 30px;
        padding: 10px 18px;
        border-radius: 999px;
        background: var(--ink);
        color: var(--paper);
        font-size: 14px;
      }

      .stage {
        min-width: 0;
      }

      .shot {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: 0 28px 60px -30px rgba(28, 34, 60, 0.35);
        overflow: hidden;
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
        color: var(--ink-3);
        font-size: 12px;
      }

      .dots {
        display: flex;
        gap: 6px;
      }

      .dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(28, 32, 48, 0.16);
      }

      .addr {
        margin-left: 8px;
      }

      .shot img {
        display: block;
        width: 100%;
        height: auto;
      }

      .caption {
        margin-top: 14px;
        color: var(--ink-3);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <section class="panel">
        <div class="marks">
          <img class="icon" src="../public/favicon.svg" alt="" width="74" height="74" />
          <p class="kicker"><i></i> Navigateur de travail · v{{version}}</p>
        </div>

        <h1>Un navigateur<br />qui <b>range</b>.</h1>

        <p class="sub">
          Onglets verticaux, espaces isolés, sessions gardées, notes locales.
        </p>

        <p class="foot">macOS · Windows · Linux — gratuit, MIT, sans compte</p>
      </section>

      <section class="stage">
        <figure class="shot">
          <div class="bar">
            <span class="dots"><span></span><span></span><span></span></span>
            <span class="addr">Accueil — Personnel</span>
          </div>
          <img src="{{shot}}" alt="" />
        </figure>
        <p class="caption">Azimut {{version}} — l’accueil, ses espaces et ses pages récentes</p>
      </section>
    </div>
  </body>
</html>
