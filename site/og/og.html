<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Vela — visuel de partage 1200×630</title>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }

      :root {
        --paper: #faf8f5;
        --surface: #fffdfa;
        --ink: #1b1a18;
        --ink-2: #5d574f;
        --ink-3: #6f6860;
        --accent: #5b5bd6;
        --line: rgba(27, 26, 24, 0.12);
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .frame {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 58px 64px;
        display: grid;
        grid-template-columns: 470px 1fr;
        gap: 46px;
        align-items: center;
        background:
          radial-gradient(620px 420px at 96% 4%, rgba(91, 91, 214, 0.16), transparent 68%),
          radial-gradient(520px 360px at 2% 100%, rgba(91, 91, 214, 0.07), transparent 70%),
          var(--paper);
      }

      .frame::after {
        content: "";
        position: absolute;
        inset: 18px;
        border: 1px solid var(--line);
        border-radius: 26px;
        pointer-events: none;
      }

      .copy {
        position: relative;
        z-index: 2;
      }

      .kicker {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--ink-3);
        font-family: ui-monospace, Menlo, monospace;
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .kicker i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
      }

      h1 {
        margin-top: 24px;
        font-family: "Iowan Old Style", Palatino, Georgia, serif;
        font-size: 76px;
        font-weight: 400;
        line-height: 0.98;
        letter-spacing: -0.025em;
      }

      h1 em {
        color: var(--accent);
        font-style: italic;
      }

      .sub {
        margin-top: 24px;
        max-width: 24ch;
        color: var(--ink-2);
        font-size: 20px;
        line-height: 1.5;
      }

      .foot {
        margin-top: 34px;
        color: var(--ink-3);
        font-family: ui-monospace, Menlo, monospace;
        font-size: 13px;
        letter-spacing: 0.02em;
      }

      .shot {
        position: relative;
        z-index: 1;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: 0 44px 80px -34px rgba(48, 38, 24, 0.55);
        overflow: hidden;
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 38px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
        background: #f6f2ea;
      }

      .dots {
        display: flex;
        gap: 6px;
      }

      .dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(27, 26, 24, 0.16);
      }

      .addr {
        flex: 1;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        color: var(--ink-3);
        font-family: ui-monospace, Menlo, monospace;
        font-size: 10.5px;
      }

      .shot img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="copy">
        <p class="kicker"><i></i> Vela · v0.3.16</p>
        <h1>Le web,<br /><em>votre atelier.</em></h1>
        <p class="sub">Onglets verticaux, espaces isolés, notes locales. L’atelier s’ouvre quand vous en avez besoin.</p>
        <p class="foot">macOS · Windows · Linux — gratuit, MIT, sans compte</p>
      </div>

      <div class="shot">
        <div class="bar">
          <span class="dots"><span></span><span></span><span></span></span>
          <span class="addr">vela.local — Accueil</span>
        </div>
        <img src="../public/captures/accueil-clair-1080.jpg" alt="" />
      </div>
    </div>
  </body>
</html>
