[package]
name = "vela-shell"
version = "0.1.0"
edition = "2021"
description = "Vela — coque de navigateur en Rust, WKWebView sur macOS et WebView2 sur Windows"
license = "MIT"

[dependencies]
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.34"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
wry = { version = "0.54", features = ["protocol", "devtools"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
