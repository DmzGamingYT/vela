name: Release

# Publication entièrement automatique : dès qu'un commit arrive sur `main` avec
# une version de package.json qui n'a pas encore de release, les trois
# installateurs sont construits et publiés sur GitHub. Rien à faire à la main.
#
# macOS : trois builds sont produits — universel (un .dmg et un .zip pour
# Apple silicon et Intel), puis arm64 et x64 séparés, conservés tant que
# l'universel n'est pas validé sur une vraie machine Intel. Si les secrets de
# signature sont présents, l'app est signée avec un certificat Developer ID
# puis notarisée par Apple : c'est ce qui permet à electron-updater
# (Squirrel.Mac) de remplacer le bundle tout seul, sans repasser par le .dmg.
# Sans secrets, le build reste signé ad hoc et l'auto-update macOS est désactivé
# de fait (Gatekeeper refuse l'installation silencieuse).
#
# Indépendamment d'Apple : VELA_UPDATE_SIGNING_KEY (semi-privée Ed25519, générée
# par scripts/make-update-key.cjs) signe latest-mac.yml, et l'application ne
# propose une mise à jour que si cette signature correspond à la moitié publique
# épinglée dans src/main/integrity.ts. Sans ce secret, la CI échoue plutôt que
# de publier un manifeste que Vela refuserait.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "La release v$VERSION existe déjà — rien à publier."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Nouvelle version v$VERSION — build et publication."
          fi

  # Vérifications systématiques : les types, le lint et les tests passent avant
  # qu'un seul installateur soit construit. Ce travail tourne à chaque poussée sur
  # `main`, même quand aucune release n'est à produire, pour que le site et
  # les flux réseau restent vérifiés en continu.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérifier les types
        run: npm run typecheck
      - name: Vérifier le style
        run: npm run lint
      - name: Lancer les tests
        run: npm test
      # Phase 1 Rust : la crate du filtre de traqueurs est compilée et testée à
      # chaque poussée. Si elle ne compile plus, aucune release ne part.
      #
      # Les étapes sont conditionnées à la présence de la crate dans le dépôt :
      # elle vit encore dans l'arbre de travail (`native/` non suivi). Sans la
      # condition, la CI échouerait sur un clone qui ne la contient pas encore.
      - name: Installer la chaîne Rust
        if: hashFiles('native/vela-blocklist/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
      - name: Tester la crate du filtre
        if: hashFiles('native/vela-blocklist/Cargo.toml') != ''
        run: cargo test --release --manifest-path native/vela-blocklist/Cargo.toml
      # Les listes vivent dans `src/main/blocklist.ts` et sont recopiées en Rust
      # par `scripts/gen-blocklist-rs.cjs` : sans cette garde, la promesse
      # « dérive impossible » du README de la crate n'était vérifiée nulle part.
      - name: Vérifier que les listes Rust suivent le TypeScript
        if: hashFiles('native/vela-blocklist/Cargo.toml', 'scripts/gen-blocklist-rs.cjs') != ''
        run: |
          npm run native:gen
          git diff --exit-code -- native/vela-blocklist/src/hosts.rs
      # Le site annonce une version et six empreintes : si elles ne
      # correspondent plus à la release publiée, la vérification échoue ici
      # plutôt que sur la page publique.
      - name: Vérifier la cohérence du site avec la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run site:check

  build-mac:
    needs: [version, checks]
    if: needs.version.outputs.publish == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installer la chaîne Rust
        if: hashFiles('native/vela-blocklist/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # Un seul `.node` universel : `@electron/universal` refuse de fusionner
      # deux bundles dont un fichier diffère (il ne sait pas réconcilier un
      # binaire qui n'existe que d'un côté). `lipo` règle le problème en amont
      # — même fichier des deux côtés, et chaque tranche se charge selon
      # l'architecture du processus hôte.
      - name: Construire le filtre de traqueurs (universel)
        if: hashFiles('native/vela-blocklist/Cargo.toml') != ''
        run: |
          set -euo pipefail
          cargo build --release --manifest-path native/vela-blocklist/Cargo.toml --target aarch64-apple-darwin
          cargo build --release --manifest-path native/vela-blocklist/Cargo.toml --target x86_64-apple-darwin
          lipo -create \
            native/vela-blocklist/target/aarch64-apple-darwin/release/libvela_blocklist.dylib \
            native/vela-blocklist/target/x86_64-apple-darwin/release/libvela_blocklist.dylib \
            -output native/vela-blocklist/vela-blocklist.node
          for ARCH in arm64 x86_64; do
            lipo -archs native/vela-blocklist/vela-blocklist.node | tr ' ' '\n' | grep -qx "$ARCH" || {
              echo "::error::Le filtre universel n'a pas de tranche $ARCH."
              exit 1
            }
          done
      - name: Détecter les secrets de signature
        id: detect
        env:
          CERT: ${{ secrets.MAC_CERT_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Les trois identifiants Apple sont obligatoires ensemble : electron-builder
          # échoue s'il n'en trouve qu'une partie. On ne les expose que complets.
          NOTARY=false
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${TEAM:-}" ]; then NOTARY=true; fi
          if [ -n "${CERT:-}" ]; then echo "cert=true" >> "$GITHUB_OUTPUT"; else echo "cert=false" >> "$GITHUB_OUTPUT"; fi
          echo "notary=$NOTARY" >> "$GITHUB_OUTPUT"
          echo "Signature Developer ID : $([ -n "${CERT:-}" ] && echo oui || echo non) — notarisation : $([ "$NOTARY" = true ] && echo oui || echo non)"
      - name: Importer le certificat Developer ID
        if: steps.detect.outputs.cert == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/vela-signing.keychain-db"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p vela "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p vela "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k vela "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "Identités disponibles :"
          security find-identity -v -p codesigning
      - name: Construire, signer et notariser
        env:
          APPLE_ID: ${{ steps.detect.outputs.notary == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ steps.detect.outputs.notary == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.detect.outputs.notary == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          if [ "${{ steps.detect.outputs.cert }}" != "true" ]; then
            echo "::warning::Aucun certificat Developer ID (secret MAC_CERT_P12) : build ad hoc, auto-update macOS inactif."
          fi
          if [ "${{ steps.detect.outputs.notary }}" != "true" ]; then
            echo "::warning::Pas d'identifiants de notarisation (APPLE_ID / APPLE_TEAM_ID) : l'app sera signée mais non notarisée."
          fi
          npm run dist:mac -- --publish never
      - name: Signer le manifeste macOS
        env:
          VELA_UPDATE_SIGNING_KEY: ${{ secrets.VELA_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # Un manifeste non signé est refusé par l'application : le publier
          # quand même ferait croire à une mise à jour disponible pour personne.
          if [ -z "${VELA_UPDATE_SIGNING_KEY:-}" ]; then
            echo "::error::Secret VELA_UPDATE_SIGNING_KEY absent. Lancez node scripts/make-update-key.cjs puis gh secret set VELA_UPDATE_SIGNING_KEY --repo \$GITHUB_REPOSITORY < build/update-signing.key"
            exit 1
          fi
          node scripts/sign-update-manifest.cjs release/mac/latest-mac.yml
      - name: Vérifier les trois bundles et la mise à jour par architecture
        env:
          NOTARY: ${{ steps.detect.outputs.notary }}
          SIGNED: ${{ steps.detect.outputs.cert }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(release/mac/mac*/Vela.app)
          echo "Bundles trouvés : ${#apps[@]}"
          if [ "${#apps[@]}" -ne 3 ]; then
            echo "::error::Trois bundles attendus (mac-universal, mac-arm64, mac) ; trouvé ${#apps[@]}."
            exit 1
          fi
          for APP in "${apps[@]}"; do
            echo "— $APP"
            echo "  nom : $(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP/Contents/Info.plist")"
            echo "  tranches : $(lipo -archs "$APP/Contents/MacOS/Vela")"
            # Le filtre Rust doit être DANS le bundle, avec ses deux tranches.
            # C'est le défaut qu'on vient de corriger : la crate compilait mais
            # `extraResources` ne la copiait pas, et l'app retombait en silence
            # sur le TypeScript chez tous les utilisateurs.
            if [ -f native/vela-blocklist/vela-blocklist.node ]; then
              FILTRE="$APP/Contents/Resources/native/vela-blocklist/vela-blocklist.node"
              if [ ! -f "$FILTRE" ]; then
                echo "::error::Filtre Rust absent du bundle : $APP"
                exit 1
              fi
              echo "  filtre : $(lipo -archs "$FILTRE")"
              for ARCH in arm64 x86_64; do
                lipo -archs "$FILTRE" | tr ' ' '\n' | grep -qx "$ARCH" || {
                  echo "::error::Le filtre du bundle n'a pas de tranche $ARCH : $APP"
                  exit 1
                }
              done
            fi
            codesign --verify --deep --strict --verbose=2 "$APP"
            if [ "$SIGNED" = "true" ]; then
              codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Runtime|Identifier" || true
            fi
          done

          UNIVERSAL="release/mac/mac-universal/Vela.app/Contents/MacOS/Vela"
          for ARCH in arm64 x86_64; do
            lipo -archs "$UNIVERSAL" | tr ' ' '\n' | grep -qx "$ARCH" || {
              echo "::error::Le binaire universel n’a pas de tranche $ARCH."
              exit 1
            }
          done

          if [ "$NOTARY" = "true" ]; then
            for APP in "${apps[@]}"; do
              xcrun stapler validate "$APP"
              spctl --assess --type execute --verbose=4 "$APP"
            done
          else
            echo "::warning::Pas de notarisation : Gatekeeper refusera l’installation silencieuse. Le .dmg reste la voie documentée."
          fi

          # Vérifie que le manifeste publié laisse electron-updater choisir le
          # bon .zip sur Apple silicon et sur Intel.
          node scripts/verify-mac-update.cjs release/mac/latest-mac.yml
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          if-no-files-found: error
          path: |
            release/mac/*.dmg
            release/mac/*.zip
            release/mac/*.blockmap
            release/mac/latest-mac.yml
            release/mac/latest-mac.yml.sig

  build-win:
    needs: [version, checks]
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installer la chaîne Rust
        if: hashFiles('native/vela-blocklist/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
      - name: Construire le filtre de traqueurs
        if: hashFiles('native/vela-blocklist/Cargo.toml') != ''
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path native/vela-blocklist/Cargo.toml
          cp native/vela-blocklist/target/release/vela_blocklist.dll \
             native/vela-blocklist/vela-blocklist.node
      - name: Construire l’installateur
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ]; then
            echo "::warning::Aucun certificat Windows (secret WIN_CSC_LINK) : l’installateur reste non signé, SmartScreen avertira."
          fi
          npm run dist:win -- --publish never
      - name: Vérifier que le filtre Rust est dans le paquet
        if: hashFiles('native/vela-blocklist/Cargo.toml') != ''
        shell: bash
        run: |
          set -euo pipefail
          FILTRE=$(find release/win -path '*resources/native/vela-blocklist/vela-blocklist.node' | head -1)
          if [ -z "$FILTRE" ]; then
            echo "::error::Filtre Rust absent du paquet Windows."
            exit 1
          fi
          ls -l "$FILTRE"
      - uses: actions/upload-artifact@v4
        with:
          name: win
          if-no-files-found: error
          path: |
            release/win/*.exe
            release/win/*.blockmap
            release/win/latest.yml

  build-linux:
    needs: [version, checks]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installer la chaîne Rust
        if: hashFiles('native/vela-blocklist/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
      - name: Construire le filtre de traqueurs
        if: hashFiles('native/vela-blocklist/Cargo.toml') != ''
        run: |
          set -euo pipefail
          cargo build --release --manifest-path native/vela-blocklist/Cargo.toml
          cp native/vela-blocklist/target/release/libvela_blocklist.so \
             native/vela-blocklist/vela-blocklist.node
      - run: npm run dist:linux -- --publish never
      - name: Vérifier que le filtre Rust est dans le paquet
        if: hashFiles('native/vela-blocklist/Cargo.toml') != ''
        run: |
          set -euo pipefail
          FILTRE=$(find release/linux -path '*resources/native/vela-blocklist/vela-blocklist.node' | head -1)
          if [ -z "$FILTRE" ]; then
            echo "::error::Filtre Rust absent du paquet Linux."
            exit 1
          fi
          ls -l "$FILTRE"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            release/linux/*.AppImage
            release/linux/*.deb
            release/linux/*.blockmap
            release/linux/latest-linux.yml

  publish:
    needs: [version, checks, build-mac, build-win, build-linux]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Créer la release et joindre les installateurs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -lh dist
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Vela $VERSION" \
            --generate-notes
          gh release upload "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber
