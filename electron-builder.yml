appId: app.vela.browser
productName: Vela
directories:
  buildResources: build
  output: release
files:
  - out/**
  - userscripts/**
  - package.json
asar: true
afterPack: ./scripts/after-pack.cjs
artifactName: ${productName}-${version}-${arch}.${ext}
publish:
  provider: github
  owner: DmzGamingYT
  repo: vela
  releaseType: release
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  # Signature Developer ID + notarisation : la notarisation se déclenche seule
  # quand APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (ou APPLE_API_*)
  # sont présents dans l'environnement, et elle est simplement ignorée sinon.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    NSCameraUsageDescription: "Vela utilise la caméra pour les visioconférences et les appels lancés depuis vos pages web."
    NSMicrophoneUsageDescription: "Vela utilise le microphone pour les appels et la dictée lancés depuis vos pages web."
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  darkModeSupport: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon-512.png
  target: [AppImage, deb]
  category: Network
  syncDesktopName: true
  maintainer: Vela contributors <contact@example.com>
  description: Navigateur de travail — espaces, vue scindée, brief du jour, notes et agent local.
