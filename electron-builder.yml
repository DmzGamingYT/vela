appId: app.vela.browser
productName: Vela
directories:
  buildResources: build
  output: release
files:
  - out/**
  - userscripts/**
  - package.json
asar: true
# Le gabarit de barre de menus vit hors de l'asar : `process.resourcesPath` le
# cherche à côté de l'exécutable, et macOS lit le @2x posé à côté du 1x.
extraResources:
  - from: build/iconTemplate.png
    to: iconTemplate.png
  - from: build/iconTemplate@2x.png
    to: iconTemplate@2x.png
afterPack: ./scripts/after-pack.cjs
artifactName: ${productName}-${version}-${arch}.${ext}
publish:
  provider: github
  owner: DmzGamingYT
  repo: vela
  releaseType: release
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  # Signature Developer ID + notarisation : la notarisation se déclenche seule
  # quand APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (ou APPLE_API_*)
  # sont présents dans l'environnement, et elle est simplement ignorée sinon.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    # Nom affiché par Finder, le Dock et la barre de menus. electron-builder le
    # déduit déjà de productName ; on l'écrit pour qu'aucun script de
    # rebranding ne puisse le perdre.
    CFBundleName: Vela
    CFBundleDisplayName: Vela
    NSCameraUsageDescription: "Vela utilise la caméra pour les visioconférences et les appels lancés depuis vos pages web."
    NSMicrophoneUsageDescription: "Vela utilise le microphone pour vos notes vocales et les appels lancés depuis vos pages web. L’enregistrement reste sur cet appareil."
  # Trois architectures livrées ensemble : universel (un seul .dmg et un seul
  # .zip pour Apple silicon et Intel), plus arm64 et x64 séparés tant que
  # l'universel n'a pas été validé sur une vraie machine Intel. Le nom du
  # fichier garde l'architecture, donc latest-mac.yml reste lisible par
  # electron-updater : il préfère l'arm64 sur Apple silicon et écarte l'arm64
  # sur Intel (cf. MacUpdater.filterFilesForArch).
  target:
    - target: dmg
      arch: [universal, arm64, x64]
    - target: zip
      arch: [universal, arm64, x64]
  darkModeSupport: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon-512.png
  target: [AppImage, deb]
  category: Network
  syncDesktopName: true
  maintainer: Vela contributors <contact@example.com>
  description: Navigateur de travail — espaces, vue scindée, brief du jour, notes et agent local.
