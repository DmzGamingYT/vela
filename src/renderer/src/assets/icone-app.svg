<!-- Vela — icône de l’app : la boussole (0.3.46).
     Copie du maître `build/boussole-light.svg` pour la page À propos : le même
     dessin que celui du Dock, en SVG. Toute retouche se fait dans le maître,
     puis se recopie ici. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D3E8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <circle cx="90" cy="90" r="60" fill="#FFFFFF" fill-opacity="0.5" stroke="#8A97B5" stroke-opacity="0.55" stroke-width="2"/>
  <g stroke="#8A97B5" stroke-width="2" stroke-linecap="round">
    <line x1="90" y1="38" x2="90" y2="46"/>
    <line x1="90" y1="134" x2="90" y2="142"/>
    <line x1="38" y1="90" x2="46" y2="90"/>
    <line x1="134" y1="90" x2="142" y2="90"/>
  </g>
  <g transform="rotate(35 90 90)">
    <polygon points="90,48 103,90 77,90" fill="#F0765A"/>
    <polygon points="90,132 103,90 77,90" fill="#2C3140" fill-opacity="0.85"/>
  </g>
  <circle cx="90" cy="90" r="6" fill="#FFFFFF" stroke="#8A97B5" stroke-width="1.5"/>
  <rect x="4" y="4" width="172" height="92" rx="36" fill="url(#gloss)"/>
  <rect x="1" y="1" width="178" height="178" rx="39" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.5"/>
</svg>
