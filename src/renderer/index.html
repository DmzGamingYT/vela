<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: http: https:; font-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Vela</title>
    <script>
      // Rejoue le thème mémorisé avant le premier rendu : pas de flash indigo.
      try {
        var root = document.documentElement;
        var cached = JSON.parse(localStorage.getItem('vela.appearance') || 'null');
        if (cached && cached.tokens) {
          root.dataset.mode = cached.mode || 'light';
          root.dataset.theme = cached.themeId || 'indigo';
          root.dataset.glass = cached.glass || 'normal';
          root.dataset.contrast = cached.highContrast ? 'high' : 'normal';
          root.style.colorScheme = cached.mode || 'light';
          for (var name in cached.tokens) {
            if (typeof cached.tokens[name] === 'string') root.style.setProperty(name, cached.tokens[name]);
          }
          root.style.setProperty('--space-accent', cached.tokens['--accent-label'] || '');
        } else {
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          root.dataset.mode = dark ? 'dark' : 'light';
          root.style.colorScheme = dark ? 'dark' : 'light';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
